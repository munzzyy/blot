name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: tools the suites cross-check against
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy exiftool poppler-utils
      - name: vendored pdf.js checksums
        run: cd app/vendor/pdfjs && sha256sum -c SHA256SUMS
      - name: unit tests
        run: npm test
      - name: i18n catalog complete
        run: node tools/extract-strings.mjs
      - name: clean check
        run: bash tools/check-clean.sh
      - name: e2e in chromium
        run: |
          sudo apt-get install -qy chromium-browser
          sudo ln -sf "$(command -v chromium-browser)" /usr/local/bin/chromium
          npm run e2e

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: generate the xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: build for the simulator
        run: |
          cd ios && xcodebuild -project Blot.xcodeproj -target Blot \
            -configuration Release -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build
      - name: assert no permission prompts
        run: |
          plist=ios/build/Release-iphonesimulator/Blot.app/Info.plist
          out=$(plutil -p "$plist")
          echo "$out"
          if echo "$out" | grep -E "UsageDescription|NSAppTransportSecurity"; then
            echo "a permission prompt or ATS exception crept into the manifest"; exit 1
          fi
      - name: boot the simulator and launch the built app
        # A build that succeeds can still crash on first launch (a bad
        # Info.plist key, a scheme handler that throws before the page ever
        # loads). This boots a real simulator, installs the app, launches
        # it, and confirms the process is still running a moment later.
        # What it cannot do is drive the UI; that stays a manual check
        # (docs/IOS.md).
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; data = json.load(sys.stdin)['devices']; print(next(d['udid'] for devs in data.values() for d in devs if 'iPhone' in d['name']))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=ios/build/Release-iphonesimulator/Blot.app
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 3
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "app is not running a few seconds after launch"; exit 1
          fi
          xcrun simctl shutdown "$UDID"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: build debug apk
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: assert zero permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          out=$("$AAPT" dump permissions android/app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "$out"
          if echo "$out" | grep -E "uses-permission" | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED"; then
            echo "unexpected permission crept into the manifest"; exit 1
          fi
